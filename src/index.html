        <h1>Chrome DevTools Protocol</h1>
        <p>
          The <b>Chrome DevTools Protocol</b> allows for tools to instrument, inspect, debug and
          profile Chromium, Chrome and other Blink-based browsers. Many existing projects
          <a href="https://github.com/ChromeDevTools/awesome-chrome-devtools">currently use</a> the
          protocol. The
          <a href="https://developers.google.com/web/tools/chrome-devtools/">Chrome DevTools</a>
          uses this protocol and the team maintains its API.
        </p>

        <p>
          Instrumentation is divided into a number of domains (DOM, Debugger, Network, etc.). Each
          domain defines a number of commands it supports and events it generates. Both commands and
          events are serialized JSON objects of a fixed structure.
        </p>

        <h3>Protocol API Docs</h3>

        <p>
          <b><a href="#/Page">The latest (tip-of-tree) protocol (tot)</a></b> — It
          <a
            href="https://chromium.googlesource.com/chromium/src/+log/HEAD/third_party/blink/renderer/core/inspector/browser_protocol.pdl"
            >changes frequently</a
          >
          and can break at any time. However it captures the full capabilities of the Protocol,
          whereas the stable release is a subset. There is no backwards compatibility support
          guaranteed.
        </p>

        <p>
          <b><a href="#/v8/Runtime">v8-inspector protocol (v8)</a></b> — Enables
          <a
            href="https://medium.com/@paul_irish/debugging-node-js-nightlies-with-chrome-devtools-7c4a1b95ae27"
            >debugging &amp; profiling</a
          >
          of Node.js apps.
        </p>

        <p>
          <b><a href="#/stable/Page">stable 1.3 protocol (stable)</a></b> — The stable release of
          the protocol, tagged at Chrome 64. It includes a smaller subset of the complete protocol
          compatibilities.
        </p>

        <h3>Resources</h3>

        <p>
          See
          <a href="https://github.com/aslushnikov/getting-started-with-cdp/blob/master/README.md"
            >Getting Started with CDP</a
          >. The
          <a
            href="https://github.com/ChromeDevTools/awesome-chrome-devtools#chrome-devtools-protocol"
            >awesome-chrome-devtools</a
          >
          page links to many of the tools in the protocol ecosystem, including protocol API
          libraries in JavaScript, TypeScript, Python, Java, and Go.
        </p>

        <p>
          Consider subscribing to the
          <a href="https://groups.google.com/d/forum/chrome-debugging-protocol"
            >chrome-debugging-protocol</a
          >
          mailing list.
        </p>

        <h3 id="monitor">Using Protocol Monitor in Chrome DevTools</h3>
        <p>
          This is especially handy to understand how the DevTools frontend makes use of the
          protocol. You can view all requests/responses and methods as they happen in the Protocol
          Monitor panel in DevTools.
        </p>

        <figure class="screenshot">
          <a href="images/protocol-monitor.png" target="_blank" rel="noopener">
            <img
              src="images/protocol-monitor.png"
              height="300"
              alt="Screenshot of the Protocol Monitor"
              loading="lazy"
            />
          </a>
        </figure>

        <p>
          Click the gear icon in the top-right of the DevTools to open the <i>Settings</i> panel.
          Select <i>Experiments</i> on the left of settings. Turn on "Protocol Monitor", then close
          and reopen DevTools. Now click the ⋮ menu icon, choose <i>More Tools</i> and then select
          <i>Protocol monitor</i>.
        </p>

        <p>
          You can also send commands using Protocol Monitor. If the command does not require any
          parameters, type the command into the prompt at the bottom of the Protocol Monitor panel
          and press Enter, for example, <code>Page.captureScreenshot</code>. If the command requires
          parameters, provide them as JSON, for example,
          <code>{"cmd":"Page.captureScreenshot","args":{"format": "jpeg"}}</code>.
        </p>

        <p>
          By clicking on the icon next to the command input (in Chrome 117+), you can open the
          command editor. After you select a CDP command, the editor creates a structured form based
          on the protocol definitions that allows you to edit parameters, and view their
          documentation and types. Send the commands by clicking on the send button or using
          <code>Ctrl + Enter</code>. Use the context menu in the list of previously sent commands to
          open one of them in the editor.
        </p>

        <figure class="screenshot">
          <a href="images/cdp-editor.png" target="_blank" rel="noopener">
            <img
              src="images/cdp-editor.png"
              height="300"
              alt="Screenshot of CDP Editor"
              loading="lazy"
            />
          </a>
        </figure>

        <p>
          Alternatively, you can execute commands from the DevTools console. First,
          <a href="https://stackoverflow.com/a/12291163/89484">open devtools-on-devtools</a>, then
          within the inner DevTools window, use <code>Main.MainImpl.sendOverProtocol()</code> in the
          console:
        </p>

        <pre>
let Main = await import('./devtools-frontend/front_end/entrypoints/main/main.js'); // or './entrypoints/main/main.js' or './main/main.js' depending on the browser version
await Main.MainImpl.sendOverProtocol('Emulation.setDeviceMetricsOverride', {
  mobile: true,
  width: 412,
  height: 732,
  deviceScaleFactor: 2.625,
});

const data = await Main.MainImpl.sendOverProtocol("Page.captureScreenshot");</pre>

        <h3 id="extension">DevTools protocol via Chrome extension</h3>
        <p>
          To allow chrome extensions to interact with the protocol, we introduced
          <a href="https://developer.chrome.com/docs/extensions/reference/api/debugger"
            >chrome.debugger</a
          >
          extension API that exposes this JSON message transport interface. As a result, you can not
          only attach to the remotely running Chrome instance, but also instrument it from its own
          extension.
        </p>

        <p>
          Chrome Debugger Extension API provides a higher level API where command domain, name and
          body are provided explicitly in the <code>sendCommand</code> call. This API hides request
          ids and handles binding of the request with its response, hence allowing
          <code>sendCommand</code> to report result in the callback function call. One can also use
          this API in combination with the other Extension APIs.
        </p>

        <p>
          If you are developing a Web-based IDE, you should implement an extension that exposes
          debugging capabilities to your page and your IDE will be able to open pages with the
          target application, set breakpoints there, evaluate expressions in console, live edit
          JavaScript and CSS, display live DOM, network interaction and any other aspect that
          Developer Tools is instrumenting today.
        </p>

        <p>
          Opening embedded Developer Tools will terminate the remote connection and thus detach the
          extension.
        </p>

        <h3 id="faq">Frequently Asked Questions</h3>

        <h4 id="how-is-the-protocol-defined">How is the protocol defined?</h4>
        <p>
          The canonical protocol definitions live in the Chromium source tree: (<a
            href="https://chromium.googlesource.com/chromium/src/+/HEAD/third_party/blink/public/devtools_protocol/browser_protocol.pdl"
            >browser_protocol.pdl</a
          >
          and
          <a href="https://chromium.googlesource.com/v8/v8/+/HEAD/include/js_protocol.pdl"
            >js_protocol.pdl</a
          >). They are maintained manually by the DevTools engineering team. The declarative
          protocol definitions are used across tools; for instance, a binding layer is created
          within Chromium for the Chrome DevTools to interact with, and separately bindings
          generated for
          <a href="https://chromium.googlesource.com/chromium/src/+/HEAD/headless/README.md"
            >Chrome Headless’s C++ interface</a
          >.
        </p>

        <h4 id="json">Can I get the protocol as JSON?</h4>

        <p>
          These canonical .pdl files are mirrored on GitHub
          <a href="https://github.com/ChromeDevTools/devtools-protocol/"
            >in the devtools-protocol repo</a
          >
          where JSON versions, TypeScript definitions and closure typedefs are generated. It's
          published <a href="https://www.npmjs.com/package/devtools-protocol">regularly to NPM</a>.
        </p>

        <p>
          Also, if you've set <code>--remote-debugging-port=9222</code> with Chrome, the complete
          protocol version it speaks is available at <code>localhost:9222/json/protocol</code>.
        </p>

        <h4 id="how-do-i-access-the-browser-target">How do I access the browser target?</h4>
        <p>
          The endpoint is exposed as <code>webSocketDebuggerUrl</code> in
          <code>/json/version</code>. Note the <code>browser</code> in the URL, rather than
          <code>page</code>. If Chrome was launched with <code>--remote-debugging-port=0</code> and
          chose an open port, the browser endpoint is written to both stderr and the
          <code>DevToolsActivePort</code> file in browser profile folder.
        </p>

        <h4 id="simultaneous">Does the protocol support multiple simultaneous clients?</h4>
        <p>
          Chrome 63 introduced support for multiple clients. See
          <a href="https://developer.chrome.com/blog/new-in-devtools-63#multi-client"
            >this article</a
          >
          for details.
        </p>

        <p>
          Upon disconnection, the outgoing client will receive a <code>detached</code> event. For
          example:
          <code>{"method":"Inspector.detached","params":{"reason":"replaced_with_devtools"}}</code>.
          After disconnection, some apps have chosen to pause their state and offer a reconnect
          button.
        </p>

        <h3 id="endpoints">HTTP Endpoints</h3>
        <p>
          If started with a remote-debugging-port, these HTTP endpoints are available on the same
          port.
        </p>

        <h4 id="get-jsonversion">GET <code>/json/version</code></h4>
        <p>Browser version metadata</p>
        <pre>
{
    "Browser": "Chrome/124.0.6367.60",
    "Protocol-Version": "1.3",
    "User-Agent": "Mozilla/5.0 ...",
    "V8-Version": "12.4.254.12",
    "WebKit-Version": "537.36 ...",
    "webSocketDebuggerUrl": "ws://localhost:9222/devtools/browser/..."
}</pre>

        <h4 id="get-json-or-jsonlist">GET <code>/json</code> or <code>/json/list</code></h4>
        <p>A list of all available websocket targets.</p>
        <pre>
[ {
  "description": "",
  "devtoolsFrontendUrl": "/devtools/inspector.html?ws=localhost:9222/devtools/page/...",
  "id": "...",
  "title": "...",
  "type": "page",
  "url": "https://...",
  "webSocketDebuggerUrl": "ws://localhost:9222/devtools/page/..."
} ]</pre>

        <h4 id="get-jsonprotocol">GET <code>/json/protocol/</code></h4>
        <p>The current devtools protocol, as JSON.</p>

        <h4 id="get-jsonnewurl">PUT <code>/json/new?{url}</code></h4>
        <p>Opens a new tab. Responds with the websocket target data for the new tab.</p>

        <h4 id="get-jsonactivatetargetid">GET <code>/json/activate/{targetId}</code></h4>
        <p>Brings a page into the foreground (activate a tab).</p>

        <h4 id="get-jsonclosetargetid">GET <code>/json/close/{targetId}</code></h4>
        <p>Closes the target page identified by <code>targetId</code>.</p>

        <h4 id="websocket-devtoolspagetargetid">
          WebSocket <code>/devtools/page/{targetId}</code>
        </h4>
        <p>The WebSocket endpoint for the protocol.</p>
